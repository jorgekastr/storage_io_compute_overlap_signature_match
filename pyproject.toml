[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jorgekastr-storage_io_compute_overlap_signature_match"
version = "0.1.0"
description = "通过字符级与结构级特征识别特征平台工程师·存储 IO 与计算的重叠的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jorgekastr" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jorgekastr.github.io"
Repository = "https://github.com/jorgekastr/storage_io_compute_overlap_signature_match"
Issues = "https://github.com/jorgekastr/storage_io_compute_overlap_signature_match/issues"

[project.scripts]
storage_io_compute_overlap_signature_match = "storage_io_compute_overlap_signature_match:main"

[tool.setuptools]
py-modules = ["storage_io_compute_overlap_signature_match"]
